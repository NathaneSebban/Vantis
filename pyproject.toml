[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantis"
version = "0.1.0"
description = "Modular vulnerability scanner: recon + web + CVE-template detection, for authorized security testing (bug bounty, pentests)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "responses>=0.23", "httpx>=0.27", "pytest-asyncio>=0.23"]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "slowapi>=0.1.9",
    "websockets>=12.0",
]

[project.scripts]
vantis = "vantis.cli:main"

[tool.setuptools.packages.find]
include = ["vantis*"]
