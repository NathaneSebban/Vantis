[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantis"
version = "0.1.0"
description = "Modular vulnerability scanner: recon + web + CVE-template detection, for authorized security testing (bug bounty, pentests)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "responses>=0.23"]

[project.scripts]
vantis = "vantis.cli:main"

[tool.setuptools.packages.find]
include = ["vantis*"]
