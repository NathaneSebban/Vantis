id: tomcat-manager-exposed
info:
  name: Apache Tomcat Manager exposed
  severity: high
  description: The Tomcat Manager app allows deploying web applications; if reachable it can lead to full compromise.
  reference:
    - https://tomcat.apache.org/tomcat-9.0-doc/manager-howto.html
request:
  method: GET
  path: /manager/html
matchers:
  status: [200]
  body_contains:
    - "Tomcat"
